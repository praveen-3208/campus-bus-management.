<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="busGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background / Sky -->
  <rect width="600" height="400" fill="url(#skyGrad)" />

  <!-- Gate Post Left -->
  <rect x="30" y="80" width="24" height="260" rx="4" fill="#64748b" />
  <rect x="24" y="60" width="36" height="20" rx="4" fill="#38bdf8" />
  <circle cx="42" cy="70" r="4" fill="#ffffff" />

  <!-- Road -->
  <rect x="0" y="300" width="600" height="100" fill="url(#roadGrad)" />
  <line x1="20" y1="360" x2="120" y2="360" stroke="#f1f5f9" stroke-width="4" stroke-dasharray="16,12" />
  <line x1="160" y1="360" x2="300" y2="360" stroke="#f1f5f9" stroke-width="4" stroke-dasharray="16,12" />
  <line x1="340" y1="360" x2="580" y2="360" stroke="#f1f5f9" stroke-width="4" stroke-dasharray="16,12" />

  <!-- School Bus Body -->
  <rect x="120" y="140" width="380" height="160" rx="20" fill="url(#busGrad)" stroke="#b45309" stroke-width="3" />
  
  <!-- Bus Front Slope -->
  <path d="M 500 200 L 525 240 L 525 300 L 500 300 Z" fill="url(#busGrad)" />

  <!-- Windows -->
  <rect x="150" y="160" width="55" height="50" rx="6" fill="#38bdf8" opacity="0.85" />
  <rect x="220" y="160" width="55" height="50" rx="6" fill="#38bdf8" opacity="0.85" />
  <rect x="290" y="160" width="55" height="50" rx="6" fill="#38bdf8" opacity="0.85" />
  <rect x="360" y="160" width="55" height="50" rx="6" fill="#38bdf8" opacity="0.85" />
  <!-- Windshield -->
  <path d="M 430 160 L 500 160 L 520 220 L 430 220 Z" fill="#bae6fd" opacity="0.9" />

  <!-- Headlight & Tail Light -->
  <circle cx="522" cy="270" r="10" fill="#fef08a" />
  <circle cx="522" cy="270" r="14" fill="#fef08a" opacity="0.3" />
  <rect x="118" y="270" width="6" height="16" rx="2" fill="#ef4444" />

  <!-- Wheels -->
  <circle cx="190" cy="305" r="32" fill="#0f172a" stroke="#475569" stroke-width="6" />
  <circle cx="190" cy="305" r="14" fill="#94a3b8" />
  <circle cx="440" cy="305" r="32" fill="#0f172a" stroke="#475569" stroke-width="6" />
  <circle cx="440" cy="305" r="14" fill="#94a3b8" />

  <!-- Banner text on Bus -->
  <rect x="160" y="235" width="240" height="24" rx="4" fill="#1e293b" />
  <text x="280" y="252" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle" letter-spacing="1">CAMPUS BUS SERVICE</text>

  <!-- Number Plate -->
  <rect x="475" y="280" width="46" height="15" rx="2" fill="#ffffff" stroke="#000" stroke-width="1" />
  <text x="498" y="291" font-family="Courier, monospace" font-size="8" font-weight="bold" fill="#000" text-anchor="middle">KA-05-1001</text>

  <!-- Camera Gate Overlay Watermark -->
  <rect x="15" y="15" width="210" height="34" rx="6" fill="#000000" opacity="0.65" />
  <circle cx="30" cy="32" r="5" fill="#10b981" />
  <text x="45" y="36" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#ffffff">GATE CAM 01 [ENTRY]</text>
</svg>
